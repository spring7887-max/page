<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다시봄 동아리 활동 앨범</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffcd69;--paper:#fffdf9;--ink:#4f3029;--sub:#7b5a52;--pink:#f5917f;--line:#e2cfc6;--mint:#a8e3d5;--field:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3b2a1c;--paper:#2c211c;--ink:#fbeee6;--sub:#d9bfb4;--line:#5a443b;--field:#3a2d27}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1","Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.6}
h1,h2,.jua{font-family:Jua,"Gothic A1",sans-serif;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.tabs a{font-family:Jua,sans-serif;font-size:18px;padding:8px 22px;border-radius:99px;background:var(--paper);color:var(--sub);text-decoration:none;border:2px dashed var(--line)}
.tabs a[aria-current=page]{background:var(--pink);color:#fff;border-color:var(--pink)}
.card{background:var(--paper);border-radius:26px;border:2px dashed var(--line);padding:18px 14px 22px;box-shadow:6px 6px 0 rgba(0,0,0,.12)}
.viewer{position:relative;touch-action:pan-y}
.viewer img{width:100%;height:auto;display:block;border-radius:16px;cursor:zoom-in}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.nav button{font-family:Jua,sans-serif;font-size:17px;border:0;border-radius:99px;padding:8px 20px;background:var(--mint);color:#2f4f48;cursor:pointer;min-height:44px}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:8px}.dots button{width:12px;height:12px;min-height:0;padding:0;border-radius:50%;background:var(--line)}
.dots button[aria-current=true]{background:var(--pink)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.thumbs button{border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;background:none;cursor:pointer}
.thumbs button[aria-current=true]{border-color:var(--pink)}.thumbs img{width:100%;display:block}
.hello{text-align:center;margin:4px 0 16px}.hello h1{font-size:34px;margin:0}.hello p{margin:4px 0 0;color:var(--sub)}
.cta{display:block;text-align:center;margin-top:16px;font-family:Jua,sans-serif;font-size:19px;background:var(--pink);color:#fff;text-decoration:none;padding:12px;border-radius:16px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:10px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px}
form h2{font-size:30px;margin:0 0 4px;text-align:center}.lead{text-align:center;color:var(--sub);margin:0 0 18px;font-size:15px}
fieldset{border:0;padding:0;margin:0 0 20px}
legend,label.q{font-family:Jua,sans-serif;font-size:19px;margin-bottom:8px;display:block;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin-bottom:8px;border-radius:14px;border:2px solid var(--line);background:var(--field);cursor:pointer;font-size:15px}
.opt input{margin-top:4px;accent-color:var(--pink);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--pink);background:color-mix(in srgb,var(--pink) 14%,var(--field))}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:14px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.opt:has(input:focus-visible){outline:3px solid #3a8fd9;outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}small{color:var(--sub)}
.btn{width:100%;font-family:Jua,sans-serif;font-size:20px;border:0;border-radius:16px;padding:13px;background:var(--pink);color:#fff;cursor:pointer}
.msg{margin-top:12px;text-align:center;font-weight:600}.err{color:#c0392b}
.admin{margin-top:22px;border-top:2px dashed var(--line);padding-top:16px}
.admin .item{padding:10px 12px;border-radius:12px;background:var(--field);margin-bottom:8px;font-size:14px;border:1px solid var(--line)}
.admin .btn{font-size:16px;padding:10px;width:auto;padding-inline:18px;margin-bottom:10px}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap">
<nav class="tabs" aria-label="메뉴"><a href="#album" id="t1">활동 앨범</a><a href="#survey" id="t2">활동 설문</a></nav>

<main id="album" class="card">
 <header class="hello"><h1>다시봄 🌱</h1><p>신일비즈니스고 · 2026 다시봄 동아리 활동 앨범</p></header>
 <div class="viewer" id="viewer"><img id="main" alt=""></div>
 <div class="nav"><button id="prev">이전</button><div class="dots" id="dots"></div><button id="next">다음</button></div>
 <div class="thumbs" id="thumbs"></div>
 <a class="cta" href="#survey">활동 마무리 설문 작성하기</a>
</main>

<main id="survey" class="card" hidden>
 <form id="f" novalidate>
  <h2>동아리 활동 설문</h2>
  <p class="lead">생활기록부 동아리 활동 내용을 쓰는 데 참고해요.<br>솔직하게 적어 주세요.</p>
  <div class="row" style="margin-bottom:20px">
   <div><label class="q" for="nm">이름</label><input type="text" id="nm" autocomplete="name" maxlength="20"></div>
   <div><label class="q" for="no">학번</label><input type="text" id="no" inputmode="numeric" maxlength="10" placeholder="예: 20101"></div>
  </div>
  <fieldset><legend>1. 가장 기억에 남는 활동은 무엇인가요?</legend>
   <label class="opt"><input type="radio" name="act" value="중학생 대상 홍보 부스 운영"><span>중학생 대상 홍보 부스 운영</span></label>
   <label class="opt"><input type="radio" name="act" value="자원순환 의식 함양 캔버스백 만들기"><span>자원순환 의식 함양 캔버스백 만들기</span></label>
   <label class="opt"><input type="radio" name="act" value="성격유형에 맞는 분리수거 방법 찾아보고 키링 제작하기"><span>성격유형에 맞는 분리수거 방법 찾아보고 키링 제작하기</span></label>
   <label class="opt"><input type="radio" name="act" value="NFC 키링 제작하기"><span>NFC 키링 제작하기</span></label>
   <label class="opt"><input type="radio" name="act" value="양말목 공예"><span>양말목 공예</span></label>
  </fieldset>
  <fieldset><label class="q" for="why">그 활동이 기억에 남는 이유</label><textarea id="why" maxlength="500" placeholder="무엇을 하고, 무엇을 느꼈는지 적어 주세요."></textarea></fieldset>
  <fieldset><label class="q" for="pl">2. 앞으로 환경보호를 위해 실천하고 싶은 행동</label><textarea id="pl" maxlength="600" placeholder="내가 일상에서 실천할 수 있는 행동을 구체적으로 적어 주세요."></textarea></fieldset>
  <button class="btn" type="submit" id="go">설문 제출하기</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
 </form>
 <section class="admin" id="admin" hidden><h2 class="jua" style="font-size:22px;margin:0 0 10px">제출 현황 (선생님용)</h2><button class="btn" id="csv" type="button">CSV로 저장</button><div id="list"></div></section>
</main>

 uid=await user.id();
 const s=await db.doc("responses/"+uid).get();
 if(s.exists){const d=s.data();$("nm").value=d.name||"";$("no").value=d.no||"";$("why").value=d.why||"";$("pl").value=d.plan||"";
  document.querySelectorAll('input[name=act]').forEach(r=>r.checked=r.value===d.act);say("이미 제출했어요. 고쳐서 다시 제출할 수 있어요.")}
 if(user.canEdit()){$("admin").hidden=false;
  db.collection("responses").onSnapshot(q=>{window._rows=q.docs.map(d=>d.data());
   $("list").innerHTML=window._rows.length?window._rows.map(r=>`<div class="item"><b>${esc(r.name)}</b> (${esc(r.no)})<br>기억에 남는 활동: ${esc(r.act)}<br>이유: ${esc(r.why)||"-"}<br>실천: ${esc(r.plan)}</div>`).join(""):"아직 제출한 학생이 없어요."},()=>{})}
}catch(e){say("설문 저장 기능을 불러오지 못했어요.",true)}})();
$("f").addEventListener("submit",async e=>{e.preventDefault();
 const act=(document.querySelector('input[name=act]:checked')||{}).value;
 const d={name:$("nm").value.trim(),no:$("no").value.trim(),act,why:$("why").value.trim(),plan:$("pl").value.trim(),at:new Date().toISOString()};
 if(!d.name||!d.no)return say("이름과 학번을 입력해 주세요.",true);
 if(!d.act)return say("1번 문항에서 활동을 하나 선택해 주세요.",true);
 if(!d.why)return say("기억에 남는 이유를 적어 주세요.",true);
 if(!d.plan)return say("2번 문항에 실천하고 싶은 행동을 적어 주세요.",true);
 if(!db)return say("로그인 후에 제출할 수 있어요.",true);
 $("go").disabled=true;
 try{await db.doc("responses/"+uid).set(d);say("제출했어요. 고마워요! 🌍")}
 catch(err){say("제출하지 못했어요. 잠시 후 다시 시도해 주세요.",true)}
 $("go").disabled=false});
$("csv").onclick=async()=>{const dl=await claude.use("downloads");if(!dl)return;
 const q=s=>'"'+String(s||"").replace(/"/g,'""')+'"';
 const rows=[["이름","학번","가장 기억에 남는 활동","이유","실천하고 싶은 행동","제출시각"]].concat((window._rows||[]).map(r=>[r.name,r.no,r.act,r.why,r.plan,r.at]));
 try{await dl.save({filename:"다시봄_설문결과.csv",data:"\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")})}catch(e){}};
</script></body></html>
